project: mswe-gnn-ahr-sweep
program: finetune_ahr.py
command:
  - ${env}
  - python
  - ${program}
  - --config
  - configs/config_best_sweep.yaml

method: bayes
metric:
  name: val_loss
  goal: minimize

early_terminate:
  type: hyperband
  min_iter: 30

parameters:
  models.hid_features:
    values: [32, 64]

  K:
    values:
      - [1, 1, 1, 3, 3, 2, 1]
      - [1, 1, 1, 5, 4, 3, 2]
      - [1, 2, 2, 7, 5, 4, 3]

  temporal_dataset_parameters.rollout_steps:
    values: [2, 3, 4, 5]

  trainer_options.batch_size:
    values: [2, 4, 6, 8]

  lr_info.learning_rate:
    distribution: log_uniform_values
    min: 0.0005
    max: 0.003

  trainer_options.shallow_weight:
    values: [1, 2, 3, 5, 10]

  trainer_options.shallow_threshold:
    value: 0.30
  saved_model:
    value: ''
  temporal_dataset_parameters.previous_t:
    value: 3
  trainer_options.max_epochs:
    value: 1000
  trainer_options.patience:
    value: 300
  trainer_options.conservation:
    value: 0
  trainer_options.curriculum_epoch:
    value: 15
